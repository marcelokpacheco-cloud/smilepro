<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmilePro Gestão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--p:#0f766e;--bg:#f4f7f7;--c:#fff;--t:#1f2937;--m:#6b7280;--b:#e5e7eb;--r:#dc2626}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
nav{width:200px;background:var(--p);color:#fff;padding:16px 0;flex-shrink:0}
nav h1{font-size:16px;margin:0 16px 16px}nav a{display:block;padding:10px 16px;color:#d1fae5;cursor:pointer}nav a.on,nav a:hover{background:#115e59;color:#fff}
main{flex:1;padding:20px;overflow:auto;min-width:0}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}.kpis .card{margin:0}.kpis b{display:block;font-size:22px;color:var(--p)}.kpis span{color:var(--m)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b)}th{color:var(--m);font-weight:600}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:6px;font:inherit}
button{background:var(--p);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}button.s{background:#e5e7eb;color:var(--t)}button.d{background:var(--r)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.row>*{flex:1;min-width:140px}.row>button{flex:0 0 auto}
.odo{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}.odo button{padding:6px 0;font-size:11px;background:#fff;color:var(--t);border:1px solid var(--b)}
.st1{background:#fecaca!important}.st2{background:#bfdbfe!important}.st3{background:#d1d5db!important;text-decoration:line-through}.st4{background:#fde68a!important}
.chat{height:340px;overflow:auto;border:1px solid var(--b);border-radius:6px;padding:10px;margin-bottom:8px;background:#fafafa}.chat p{margin:0 0 8px;white-space:pre-wrap}.chat .u{text-align:right;color:var(--p)}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:#e5e7eb}.tag.ok{background:#d1fae5}.tag.no{background:#fee2e2}.kan{display:flex;gap:10px;overflow-x:auto;align-items:flex-start}.col{min-width:220px;flex:1;background:#eef2f2;border-radius:8px;padding:8px}.lead{background:#fff;border:1px solid var(--b);border-radius:6px;padding:8px;margin-top:8px}.lead select{margin-top:6px}
.gr th,.gr td{padding:4px;border:1px solid var(--b);font-size:12px;min-width:92px;vertical-align:top;cursor:pointer}.gr th:first-child{min-width:48px}.ev{color:#fff;border-radius:4px;padding:2px 6px;margin-bottom:2px}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gal img{width:100%;border-radius:6px}
@media(max-width:700px){body{flex-direction:column}nav{width:auto;display:flex;overflow:auto}nav h1{display:none}.odo{grid-template-columns:repeat(8,1fr)}}
</style></head><body><nav></nav><main></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let RC={};
const cfgLocal=()=>JSON.parse(localStorage.getItem('sp_cfg')||'{}');
const cfg=()=>({...cfgLocal(),...RC});
/* url/key do Supabase ficam no navegador (necessários para conectar); o resto vive na tabela "configuracoes" */
async function loadCfg(){if(!sb)return;
 const{data,error}=await sb.from('configuracoes').select('dados').eq('id','clinica').maybeSingle();
 if(error){console.warn('configuracoes:',error.message);alert('Não foi possível ler as configurações no Supabase ('+error.message+'). Crie a tabela "configuracoes" (veja o SQL).');return}
 const{url,key,...rest}=cfgLocal();let dados=data?.dados||{};
 if(Object.keys(rest).length){dados={...dados,...rest};const{error:e2}=await sb.from('configuracoes').upsert({id:'clinica',dados,updated_at:new Date().toISOString()});
  if(e2){alert('Erro ao gravar configurações no Supabase: '+e2.message);RC=dados;return}
  localStorage.setItem('sp_cfg',JSON.stringify({url,key}))}
 RC=dados}
let sb=null,S={pacientes:[],consultas:[],leads:[],pesquisas:[],log:[],profissionais:[],orcamentos:[],evolucoes:[],fotos:[]},view='dash',chat=[];
let sbKey='';function initSb(){const c=cfg(),k=c.url+'|'+c.key;if(c.url&&c.key&&window.supabase){if(!sb||k!=sbKey){sb=supabase.createClient(c.url,c.key);sbKey=k}}else sb=null}
const LS=t=>JSON.parse(localStorage.getItem('sp_'+t)||'[]');
const db={
 async list(t){if(sb){const{data,error}=await sb.from(t).select('*').order('created_at',{ascending:false});if(error)throw error;return data}return LS(t)},
 async save(t,o){if(sb){const{error}=o.id?await sb.from(t).update(o).eq('id',o.id):await sb.from(t).insert(o);if(error)throw error;return}
  const l=LS(t);if(o.id){const i=l.findIndex(x=>x.id==o.id);l[i]={...l[i],...o}}else l.unshift({...o,id:crypto.randomUUID(),created_at:new Date().toISOString()});localStorage.setItem('sp_'+t,JSON.stringify(l))},
 async del(t,id){if(sb){await sb.from(t).delete().eq('id',id);return}localStorage.setItem('sp_'+t,JSON.stringify(LS(t).filter(x=>x.id!=id)))}
};
async function gemini(prompt,sys){const k=cfg().gemini;if(!k)throw new Error('Configure a chave Gemini em Configurações.');
 for(let i=0;i<4;i++){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg().modelo||'gemini-3.5-flash'}:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys||''}]},contents:[{role:'user',parts:[{text:prompt}]}]})});
  if(r.ok){const j=await r.json();return j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||''}
  if(![429,500,503].includes(r.status))throw new Error('Gemini '+r.status+(r.status==404?' (modelo indisponível: troque o modelo em Configurações)':''));await new Promise(s=>setTimeout(s,1000*2**i))}
 throw new Error('Gemini indisponível, tente novamente.')}
const ctx=()=>`Você é a assistente da clínica ${cfg().nome||'SmilePro Odontologia'} (Curitiba). Responda em português do Brasil, de forma objetiva e profissional. Nunca dê diagnóstico definitivo; sugira avaliação do dentista. Dados: ${S.pacientes.length} pacientes. Consultas de hoje: ${JSON.stringify(S.consultas.filter(c=>c.data==hoje()).map(c=>({p:c.paciente_nome,h:c.hora,proc:c.procedimento,st:c.status})))}`;

async function boot(){initSb();if(sb){const{data}=await sb.auth.getSession();if(!data.session)return login();await loadCfg()}load()}
function login(){$('nav').innerHTML='';$('main').innerHTML=`<div class="card" style="max-width:340px;margin:60px auto"><h3>Entrar</h3><input id="le" placeholder="E-mail" style="margin-bottom:8px"><input id="lp" type="password" placeholder="Senha" style="margin-bottom:8px"><button onclick="doLogin()">Entrar</button> <button class="s" onclick="go('cfg')">Configurações</button></div>`}
async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:$('#le').value,password:$('#lp').value});if(error)return alert(error.message);boot()}
async function load(){try{[S.pacientes,S.consultas,S.leads,S.pesquisas,S.log,S.profissionais,S.orcamentos,S.evolucoes,S.fotos]=await Promise.all(['pacientes','consultas','leads','pesquisas','mensagens_log','profissionais','orcamentos','evolucoes','fotos'].map(t=>db.list(t)))}catch(e){alert('Erro Supabase: '+e.message)}render();gSync()}
const NAV=[['dash','Painel'],['pac','Pacientes'],['agenda','Agenda'],['fin','Financeiro'],['crm','CRM'],['ia','🤖 Assistente IA'],['cfg','Configurações']];
function render(){$('nav').innerHTML='<h1>'+esc(cfg().nome||'SmilePro')+'</h1>'+NAV.map(([k,l])=>`<a class="${k==view?'on':''}" onclick="go('${k}')">${l}</a>`).join('')+(sb?`<a onclick="sb.auth.signOut().then(boot)">Sair</a>`:'');
 ({dash:vDash,pac:()=>vPac(),agenda:vAgenda,fin:vFin,ia:vIa,crm:vCrm,cfg:vCfg}[view])()}
const go=v=>{view=v;render()};

function vDash(){const m=hoje().slice(0,7),pg=S.consultas.filter(c=>c.pago),sum=a=>a.reduce((s,c)=>s+ +c.valor,0);
 const mes=sum(pg.filter(c=>(c.data||'').startsWith(m))),rec=sum(S.consultas.filter(c=>!c.pago&&c.status!='cancelada'));
 const n=new Date(),meses=[...Array(6)].map((_,i)=>{const d=new Date(n.getFullYear(),n.getMonth()-5+i,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')});
 const vals=meses.map(k=>sum(pg.filter(c=>(c.data||'').startsWith(k)))),mx=Math.max(...vals,1);
 const bars=vals.map((v,i)=>{const h=v/mx*130;return `<rect x="${20+i*60}" y="${160-h}" width="40" height="${h}" fill="#0f766e" rx="3"/><text x="${40+i*60}" y="178" font-size="11" text-anchor="middle">${meses[i].slice(5)}/${meses[i].slice(2,4)}</text><text x="${40+i*60}" y="${154-h}" font-size="10" text-anchor="middle">${v?Math.round(v):''}</text>`}).join('');
 $('main').innerHTML=`<div class="kpis"><div class="card"><b>${S.pacientes.length}</b><span>Pacientes</span></div><div class="card"><b>${S.consultas.filter(c=>c.data==hoje()).length}</b><span>Consultas hoje</span></div><div class="card"><b>${brl(mes)}</b><span>Recebido no mês</span></div><div class="card"><b>${brl(rec)}</b><span>A receber</span></div></div><div class="card"><h3>Recebimentos (6 meses, R$)</h3><svg viewBox="0 0 380 190" width="100%" style="max-width:520px">${bars}</svg></div>`}

function vPac(q=''){const l=S.pacientes.filter(p=>((p.nome||'')+(p.telefone||'')).toLowerCase().includes(q.toLowerCase()));
 $('main').innerHTML=`<div class="row"><input id="q" placeholder="Buscar paciente" value="${esc(q)}" oninput="vPac(this.value);const e=$('#q');e.focus();e.setSelectionRange(99,99)"><button onclick="fPac()">Novo paciente</button></div><div id="f"></div><div class="card"><table><tr><th>Nome</th><th>Telefone</th><th>Nascimento</th><th></th></tr>${l.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.telefone)}</td><td>${esc(p.nascimento)}</td><td><button class="s" onclick="ficha('${p.id}')">Ficha</button></td></tr>`).join('')||'<tr><td colspan=4>Nenhum paciente.</td></tr>'}</table></div>`}
function fPac(id){const p=S.pacientes.find(x=>x.id==id)||{};$('#f').innerHTML=`<div class="card"><h3>${id?'Editar':'Novo'} paciente</h3><div class="row"><input id="n" placeholder="Nome" value="${esc(p.nome)}"><input id="t" placeholder="WhatsApp (DDD+número)" value="${esc(p.telefone)}"><input id="d" type="date" value="${esc(p.nascimento)}"></div><textarea id="h" rows="3" placeholder="Histórico, alergias, observações">${esc(p.historico)}</textarea><div class="row" style="margin-top:8px"><button onclick="sPac('${id||''}')">Salvar</button><button class="s" onclick="$('#f').innerHTML=''">Cancelar</button></div></div>`;$('#f').scrollIntoView()}
async function sPac(id){const o={nome:$('#n').value.trim(),telefone:$('#t').value.trim(),nascimento:$('#d').value||null,historico:$('#h').value};if(!o.nome)return alert('Informe o nome');if(id)o.id=id;await db.save('pacientes',o);view='pac';await load()}
async function delPac(id){if(confirm('Excluir paciente e suas consultas?')){await db.del('pacientes',id);view='pac';await load()}}

const ST=['Saudável','Cárie','Restaurado','Ausente','Em tratamento'],TT=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28,48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
function fichaBase(id){const p=S.pacientes.find(x=>x.id==id),d=p.dentes||{},cs=S.consultas.filter(c=>c.paciente_id==id);
 $('main').innerHTML=`<div class="row"><button class="s" onclick="go('pac')">Voltar</button><button onclick="fPac('${id}')">Editar dados</button><button class="d" onclick="delPac('${id}')">Excluir</button></div><div class="card"><h3>${esc(p.nome)}</h3><p>${esc(p.telefone)} | ${esc(p.nascimento)}</p><p>${esc(p.historico)}</p></div><div id="f"></div><div class="card"><h3>Odontograma</h3><p style="color:var(--m)">Clique para alternar: saudável, cárie (vermelho), restaurado (azul), ausente (cinza), em tratamento (amarelo).</p><div class="odo">${TT.map(t=>`<button class="st${d[t]||0}" title="${ST[d[t]||0]}" onclick="dente('${id}',${t})">${t}</button>`).join('')}</div></div><div class="card"><h3>Consultas</h3><table>${cs.map(c=>`<tr><td>${esc(c.data)}</td><td>${esc(c.procedimento)}</td><td>${brl(c.valor)}</td><td>${esc(c.status)}</td></tr>`).join('')||'<tr><td>Sem consultas.</td></tr>'}</table></div><div class="card"><button onclick="resumo('${id}')">🤖 Resumo do paciente com IA</button><p id="rs" style="white-space:pre-wrap"></p></div>`}
async function dente(id,t){const p=S.pacientes.find(x=>x.id==id),d={...(p.dentes||{})};d[t]=((d[t]||0)+1)%5;await db.save('pacientes',{id,dentes:d});p.dentes=d;ficha(id)}
async function resumo(id){const p=S.pacientes.find(x=>x.id==id),el=$('#rs');el.textContent='Gerando...';
 try{el.textContent=await gemini('Resuma para o dentista a ficha deste paciente, com pontos de atenção e próximos passos sugeridos (sem diagnóstico definitivo): '+JSON.stringify({nascimento:p.nascimento,anamnese:p.anamnese,historico:p.historico,dentes:Object.entries(p.dentes||{}).map(([t,s])=>t+': '+ST[s]),consultas:S.consultas.filter(c=>c.paciente_id==id).map(c=>[c.data,c.procedimento,c.status])}),ctx())}catch(e){el.textContent=e.message}}

function vAgLista(){const l=[...S.consultas].sort((a,b)=>((a.data||'')+(a.hora||'')).localeCompare((b.data||'')+(b.hora||'')));
 $('main').innerHTML=`<div class="row"><button class="s" onclick="ag.tab='sem';vAgenda()">Ver semana</button></div><div class="card"><h3>Nova consulta</h3><div class="row"><select id="cp">${S.pacientes.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select><input id="cd" type="date" value="${hoje()}"><input id="ch" type="time" value="09:00"><input id="cr" placeholder="Procedimento"><input id="cv" type="number" placeholder="Valor R$"><button onclick="sCons()">Agendar</button></div></div><div class="card"><table><tr><th>Data</th><th>Hora</th><th>Paciente</th><th>Procedimento</th><th>Status</th><th></th></tr>${l.map(c=>`<tr><td>${esc(c.data)}</td><td>${esc((c.hora||'').slice(0,5))}</td><td>${esc(c.paciente_nome)}</td><td>${esc(c.procedimento)}</td><td><select onchange="stCons('${c.id}',this.value)">${['agendada','confirmada','realizada','cancelada'].map(s=>`<option ${s==c.status?'selected':''}>${s}</option>`).join('')}</select></td><td style="white-space:nowrap"><button class="s" onclick="lembrete('${c.id}')">Lembrete</button> <button class="d" onclick="delCons('${c.id}')">x</button></td></tr>`).join('')||'<tr><td colspan=6>Sem consultas.</td></tr>'}</table></div>`}
async function stCons(id,s){await db.save('consultas',{id,status:s});await load()}
async function delCons(id){if(confirm('Excluir consulta?')){await gDel(id);await db.del('consultas',id);await load()}}
async function lembrete(id){const c=S.consultas.find(x=>x.id==id),p=S.pacientes.find(x=>x.id==c.paciente_id);let m;
 try{m=await gemini(`Escreva uma mensagem curta e cordial de WhatsApp lembrando ${c.paciente_nome} da consulta (${c.procedimento||'consulta'}) em ${c.data} às ${(c.hora||'').slice(0,5)}, pedindo confirmação. Sem emojis.`,ctx())}catch(e){return alert(e.message)}
 const tel='55'+String(p?.telefone||'').replace(/\D/g,'').replace(/^55/,'');window.open(`https://wa.me/${tel}?text=${encodeURIComponent(m.trim())}`)}

function vFin(){const l=S.consultas.filter(c=>c.valor>0);
 $('main').innerHTML=`<div class="card"><table><tr><th>Data</th><th>Paciente</th><th>Procedimento</th><th>Valor</th><th>Pagamento</th></tr>${l.map(c=>`<tr><td>${esc(c.data)}</td><td>${esc(c.paciente_nome)}</td><td>${esc(c.procedimento)}</td><td>${brl(c.valor)}</td><td><button class="${c.pago?'':'s'}" onclick="pagar('${c.id}',${!c.pago})">${c.pago?'Pago':'Pendente'}</button></td></tr>`).join('')||'<tr><td>Sem lançamentos.</td></tr>'}</table></div>`}
async function pagar(id,v){await db.save('consultas',{id,pago:v});await load()}

function vIa(){$('main').innerHTML=`<div class="card"><h3>🤖 Assistente da clínica</h3><div class="chat" id="cx">${chat.map(m=>`<p class="${m.r}">${esc(m.t)}</p>`).join('')}</div><div class="row"><input id="im" placeholder="Pergunte sobre a agenda, peça textos para redes sociais..." onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()">Enviar</button></div></div>`;const c=$('#cx');c.scrollTop=c.scrollHeight}
async function ask(){const t=$('#im').value.trim();if(!t)return;chat.push({r:'u',t},{r:'a',t:'...'});vIa();
 try{const h=chat.slice(0,-1).slice(-10).map(m=>(m.r=='u'?'Usuário: ':'Assistente: ')+m.t).join('\n');chat[chat.length-1].t=await gemini(h,ctx())}catch(e){chat[chat.length-1].t=e.message}vIa()}

function vCfg(){const c=cfg();$('main').innerHTML=`<div class="card"><h3>Configurações</h3><p style="color:var(--m)">Com Supabase configurado, estas configurações são gravadas na tabela "configuracoes" (apenas URL e chave anon ficam neste navegador, pois são necessárias para conectar). Sem Supabase, tudo fica só neste navegador (modo demonstração). Use apenas a chave anon do Supabase, com RLS ativo, nunca a service_role.</p><div class="row"><input id="cn" placeholder="Nome da clínica" value="${esc(c.nome)}"></div><div class="row"><input id="cu" placeholder="Supabase URL" value="${esc(c.url)}"><input id="ck" placeholder="Supabase anon key" value="${esc(c.key)}"></div><div class="row"><input id="cg" placeholder="Chave da API Gemini" value="${esc(c.gemini)}"><input id="gm" placeholder="Modelo Gemini (padrão: gemini-3.5-flash)" value="${esc(c.modelo)}"></div><div class="row"><input id="gc" placeholder="Google Client ID (Agenda)" value="${esc(c.gclient)}"><input id="gk" placeholder="ID da agenda (vazio = principal)" value="${esc(c.gcal)}"></div><div class="row"><select id="gi"><option value="sim" ${c.gimp!='nao'?'selected':''}>Importar eventos do Google Agenda para o sistema: sim</option><option value="nao" ${c.gimp=='nao'?'selected':''}>Importar eventos do Google Agenda para o sistema: não</option></select></div><button onclick="sCfg()">Salvar</button></div>`}
async function sCfg(){const url=$('#cu').value.trim(),key=$('#ck').value.trim(),
 dados={nome:$('#cn').value,gemini:$('#cg').value.trim(),modelo:$('#gm').value.trim(),gclient:$('#gc').value.replace(/[\s"']/g,''),gcal:$('#gk').value.trim(),gimp:$('#gi').value};
 if(!url||!key){localStorage.setItem('sp_cfg',JSON.stringify({url,key,...dados}));RC={};view='dash';return boot()}
 localStorage.setItem('sp_cfg',JSON.stringify({url,key}));initSb();
 const{data:s}=await sb.auth.getSession();
 if(!s.session){localStorage.setItem('sp_cfg',JSON.stringify({url,key,...dados}));alert('Faça login: as configurações serão enviadas ao Supabase em seguida.');view='dash';return boot()}
 const{error}=await sb.from('configuracoes').upsert({id:'clinica',dados,updated_at:new Date().toISOString()});
 if(error){localStorage.setItem('sp_cfg',JSON.stringify({url,key,...dados}));return alert('Erro ao gravar no Supabase: '+error.message+'\nCrie a tabela "configuracoes" (veja o SQL).')}
 RC=dados;view='dash';boot()}
/* ===== CRM ===== */
let crmTab='fila',fila=[];
const ETAPAS=['Novo','Contato feito','Avaliação agendada','Orçamento enviado','Fechado','Perdido'];
const addDias=n=>{const d=new Date();d.setDate(d.getDate()+n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fone=t=>'55'+String(t||'').replace(/\D/g,'').replace(/^55/,'');
const wa=(t,m)=>window.open(`https://wa.me/${fone(t)}?text=${encodeURIComponent(m)}`);
const clin=()=>cfg().nome||'SmilePro Odontologia',primeiro=n=>String(n||'').split(' ')[0];
async function texto(prompt,fb){try{return cfg().gemini?await gemini(prompt,ctx()):fb}catch(e){return fb}}
function vCrm(){const T=[['fila','Fila de mensagens'],['funil','Funil de leads'],['nps','Satisfação'],['aniv','Aniversariantes']];
 $('main').innerHTML=`<div class="row">${T.map(([k,l])=>`<button class="${k==crmTab?'':'s'}" onclick="crmTab='${k}';vCrm()">${l}</button>`).join('')}</div><div id="ct"></div>`;
 ({fila:cFila,funil:cFunil,nps:cNps,aniv:cAniv}[crmTab])()}
function mkFila(){const L=new Set(S.log.map(l=>l.tipo+'|'+l.ref)),f=[],tel=id=>S.pacientes.find(p=>p.id==id)?.telefone;
 S.consultas.forEach(c=>{const h=(c.hora||'').slice(0,5),b={ref:c.id,nome:c.paciente_nome,tel:tel(c.paciente_id)},pn=primeiro(c.paciente_nome);
  if(c.data==addDias(1)&&['agendada','confirmada'].includes(c.status))f.push({...b,tipo:'lembrete',det:`Consulta ${c.data} às ${h}`,fb:`Olá, ${pn}! Passando para lembrar da sua consulta amanhã, às ${h}, na ${clin()}. Pode confirmar sua presença?`});
  if(c.status=='realizada'&&!c.pago&&c.valor>0)f.push({...b,tipo:'cobranca',det:`${brl(c.valor)} em aberto (${c.data})`,fb:`Olá, ${pn}! Identificamos um valor de ${brl(c.valor)} em aberto referente ao atendimento de ${c.data}. Podemos ajudar com a forma de pagamento?`});
  if(c.status=='realizada'&&c.data>=addDias(-2))f.push({...b,tipo:'satisfacao',det:`Atendimento em ${c.data}`,fb:`Olá, ${pn}! Como foi seu atendimento na ${clin()}? De 0 a 10, qual a chance de nos indicar a amigos e familiares? Sua opinião é muito importante para nós.`})});
 S.pacientes.forEach(p=>{if((p.nascimento||'').slice(5)==hoje().slice(5))f.push({tipo:'aniversario',ref:p.id+'-'+hoje().slice(0,4),nome:p.nome,tel:p.telefone,det:'Aniversário hoje',fb:`Parabéns, ${primeiro(p.nome)}! A equipe da ${clin()} deseja um dia especial, com muita saúde e um sorriso cada vez mais bonito!`})});
 return f.filter(x=>!L.has(x.tipo+'|'+x.ref))}
function cFila(){fila=mkFila();const R={lembrete:'Lembrete',cobranca:'Cobrança',satisfacao:'Pesquisa',aniversario:'Aniversário'};
 $('#ct').innerHTML=`<div class="card"><p style="color:var(--m)">Mensagens que devem sair agora: lembrete de consultas de amanhã, cobrança de valores em aberto, pesquisa de satisfação pós-atendimento e aniversários. Cada envio abre o WhatsApp com o texto pronto (personalizado pela IA, se a chave Gemini estiver configurada) e a mensagem sai da fila.</p><table><tr><th>Tipo</th><th>Paciente</th><th>Detalhe</th><th></th></tr>${fila.map((x,i)=>`<tr><td><span class="tag">${R[x.tipo]}</span></td><td>${esc(x.nome)}</td><td>${esc(x.det)}</td><td style="white-space:nowrap"><button onclick="enviar(${i})">Enviar</button> <button class="s" onclick="pular(${i})">Dispensar</button></td></tr>`).join('')||'<tr><td colspan=4>Nenhuma mensagem pendente.</td></tr>'}</table></div>`}
async function enviar(i){const x=fila[i];if(!x.tel)return alert('Paciente sem telefone cadastrado');const w=window.open('','_blank');
 const m=await texto('Reescreva de forma calorosa e curta, mantendo o sentido, esta mensagem de WhatsApp de uma clínica odontológica (sem emojis, sem inventar informações): '+x.fb,x.fb);
 w.location.href=`https://wa.me/${fone(x.tel)}?text=${encodeURIComponent(m.trim())}`;await pular(i)}
async function pular(i){const x=fila[i];await db.save('mensagens_log',{tipo:x.tipo,ref:x.ref,paciente_nome:x.nome});await load()}
function cFunil(){const n=S.leads.length,f=S.leads.filter(l=>l.etapa=='Fechado').length;
 $('#ct').innerHTML=`<div class="card"><h3>Novo lead</h3><div class="row"><input id="ln" placeholder="Nome"><input id="lt" placeholder="WhatsApp"><input id="lo" placeholder="Origem (Instagram, Google...)"><input id="li" placeholder="Interesse (implante, lentes...)"><button onclick="sLead()">Adicionar</button></div><p style="color:var(--m);margin:0">${n} leads | conversão: ${n?Math.round(f/n*100):0}%</p></div><div class="kan">${ETAPAS.map(e=>{const l=S.leads.filter(x=>x.etapa==e);return `<div class="col"><b>${e}</b> <span class="tag">${l.length}</span>${l.map(x=>`<div class="lead"><b>${esc(x.nome)}</b><br><small>${esc(x.origem)} | ${esc(x.interesse)}</small><select onchange="mvLead('${x.id}',this.value)">${ETAPAS.map(s=>`<option ${s==x.etapa?'selected':''}>${s}</option>`).join('')}</select><div class="row" style="margin:6px 0 0"><button class="s" onclick="wl('${x.id}')">WhatsApp</button><button class="d" onclick="delLead('${x.id}')">x</button></div></div>`).join('')}</div>`}).join('')}</div>`}
async function sLead(){const nome=$('#ln').value.trim();if(!nome)return alert('Informe o nome');await db.save('leads',{nome,telefone:$('#lt').value.trim(),origem:$('#lo').value.trim(),interesse:$('#li').value.trim(),etapa:'Novo'});await load()}
async function mvLead(id,etapa){await db.save('leads',{id,etapa});await load()}

function wl(id){const l=S.leads.find(x=>x.id==id);wa(l.telefone,`Olá, ${primeiro(l.nome)}! Aqui é da ${clin()}. Vi seu interesse em ${l.interesse||'nossos tratamentos'} e adoraria ajudar. Podemos conversar?`)}
function cNps(){const P=S.pesquisas,n=P.length,pr=P.filter(p=>p.nota>=9).length,de=P.filter(p=>p.nota<=6).length;
 $('#ct').innerHTML=`<div class="kpis"><div class="card"><b>${n?Math.round((pr-de)/n*100):0}</b><span>NPS</span></div><div class="card"><b>${n}</b><span>Respostas</span></div><div class="card"><b>${n?(P.reduce((a,p)=>a+ +p.nota,0)/n).toFixed(1):'-'}</b><span>Nota média</span></div></div><div class="card"><h3>Registrar resposta</h3><div class="row"><select id="np">${S.pacientes.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select><input id="nn" type="number" min="0" max="10" placeholder="Nota 0-10"><input id="nc" placeholder="Comentário"><button onclick="sNps()">Registrar</button></div></div><div class="card"><button onclick="resFb()">🤖 Resumir comentários com IA</button><p id="rf" style="white-space:pre-wrap"></p><table><tr><th>Data</th><th>Paciente</th><th>Nota</th><th>Comentário</th></tr>${P.map(p=>`<tr><td>${esc((p.created_at||'').slice(0,10))}</td><td>${esc(p.paciente_nome)}</td><td><span class="tag ${p.nota>=9?'ok':p.nota<=6?'no':''}">${p.nota}</span></td><td>${esc(p.comentario)}</td></tr>`).join('')||'<tr><td colspan=4>Sem respostas.</td></tr>'}</table></div>`}
async function sNps(){const p=S.pacientes.find(x=>x.id==$('#np').value),v=$('#nn').value;if(!p||v===''||v<0||v>10)return alert('Informe paciente e nota de 0 a 10');await db.save('pesquisas',{paciente_id:p.id,paciente_nome:p.nome,nota:+v,comentario:$('#nc').value});await load()}
async function resFb(){const el=$('#rf');el.textContent='Gerando...';try{el.textContent=await gemini('Resuma os principais elogios e problemas citados nestas respostas de pesquisa de satisfação de uma clínica odontológica e sugira 3 ações de melhoria: '+JSON.stringify(S.pesquisas.map(p=>[p.nota,p.comentario])),ctx())}catch(e){el.textContent=e.message}}
function cAniv(){const m=hoje().slice(5,7),l=S.pacientes.filter(p=>(p.nascimento||'').slice(5,7)==m).sort((a,b)=>a.nascimento.slice(8)-b.nascimento.slice(8));
 $('#ct').innerHTML=`<div class="card"><h3>Aniversariantes do mês</h3><table>${l.map(p=>`<tr><td>${p.nascimento.slice(8)}/${m}</td><td>${esc(p.nome)}</td><td><button class="s" onclick="parab('${p.id}')">Parabéns</button></td></tr>`).join('')||'<tr><td>Nenhum aniversariante neste mês.</td></tr>'}</table></div>`}
function parab(id){const p=S.pacientes.find(x=>x.id==id);wa(p.telefone,`Parabéns, ${primeiro(p.nome)}! A equipe da ${clin()} deseja um dia especial, com muita saúde e um sorriso cada vez mais bonito!`)}
/* ===== FASE 1: agenda semanal + ficha clinica ===== */
let ag={w:0,prof:'',tab:'sem'},ft='anam',itens=[];
const ymd=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const SL=[];for(let h=8;h<18;h++)SL.push(String(h).padStart(2,'0')+':00',String(h).padStart(2,'0')+':30');
const slot=h=>{const[a,b]=(h||'00:00').split(':');return a+':'+(+b<30?'00':'30')};
function semana(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+ag.w*7);return[...Array(6)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return ymd(x)})}
function vAgenda(){if(ag.tab=='lista')return vAgLista();const D=semana(),P=S.profissionais,cs=S.consultas.filter(c=>c.status!='cancelada'&&(!ag.prof||c.profissional_id==ag.prof));
 $('main').innerHTML=`<div class="row"><button class="s" onclick="ag.w--;vAgenda()">Anterior</button><button class="s" onclick="ag.w=0;vAgenda()">Hoje</button><button class="s" onclick="ag.w++;vAgenda()">Próxima</button><select onchange="ag.prof=this.value;vAgenda()"><option value="">Todos os profissionais</option>${P.map(p=>`<option value="${p.id}" ${p.id==ag.prof?'selected':''}>${esc(p.nome)}</option>`).join('')}</select><button class="s" onclick="ag.tab='lista';vAgenda()">Ver lista</button><button class="s" onclick="fProf()">Profissionais</button><button class="s" onclick="gTok?gSync(true):gConectar()">${gTok?'Sincronizar Google':'Conectar Google Agenda'}</button></div><div id="f"></div><div class="card" style="overflow:auto"><table class="gr"><tr><th></th>${D.map((d,i)=>`<th>${['Seg','Ter','Qua','Qui','Sex','Sáb'][i]} ${d.slice(8)}/${d.slice(5,7)}</th>`).join('')}</tr>${SL.map(s=>`<tr><th>${s}</th>${D.map(d=>`<td onclick="novaCons('${d}','${s}')">${cs.filter(c=>c.data==d&&slot((c.hora||'').slice(0,5))==s).map(c=>`<div class="ev" style="background:${(P.find(p=>p.id==c.profissional_id)||{}).cor||'#0f766e'}" onclick="event.stopPropagation();editCons('${c.id}')">${esc(primeiro(c.paciente_nome))} <small>${esc(c.cadeira||'')}</small></div>`).join('')}</td>`).join('')}</tr>`).join('')}</table></div>`}
function opts(a,f){return a.map(f).join('')}
function novaCons(d,s){$('#f').innerHTML=`<div class="card"><h3>Nova consulta ${d.slice(8)}/${d.slice(5,7)} ${s}</h3><div class="row"><select id="cp">${opts(S.pacientes,p=>`<option value="${p.id}">${esc(p.nome)}</option>`)}</select><input id="cd" type="date" value="${d}"><input id="ch" type="time" step="1800" value="${s}"><select id="cdur">${opts([30,60,90,120],m=>`<option value="${m}">${m} min</option>`)}</select><select id="cprof">${opts(S.profissionais,p=>`<option value="${p.id}" ${p.id==ag.prof?'selected':''}>${esc(p.nome)}</option>`)}</select><select id="ccad">${opts(['Cadeira 1','Cadeira 2','Cadeira 3'],c=>`<option>${c}</option>`)}</select><input id="cr" placeholder="Procedimento"><input id="cv" type="number" placeholder="Valor R$"><button onclick="sCons()">Agendar</button></div></div>`;$('#f').scrollIntoView()}
async function sCons(){const g=i=>$('#'+i)?.value,p=S.pacientes.find(x=>x.id==g('cp'));if(!p)return alert('Cadastre um paciente primeiro');
 const pr=S.profissionais.find(x=>x.id==g('cprof')),o={paciente_id:p.id,paciente_nome:p.nome,data:g('cd'),hora:g('ch'),duracao:+g('cdur')||30,profissional_id:pr?.id||null,profissional_nome:pr?.nome||null,cadeira:g('ccad')||null,procedimento:g('cr'),valor:+g('cv')||0,status:'agendada',pago:false};
 const m=h=>{const[a,b]=h.split(':');return a*60+ +b},ini=m(o.hora),fim=ini+o.duracao;
 const x=S.consultas.find(c=>c.status!='cancelada'&&c.data==o.data&&((o.profissional_id&&c.profissional_id==o.profissional_id)||(o.cadeira&&c.cadeira==o.cadeira))&&m(c.hora)<fim&&m(c.hora)+(c.duracao||30)>ini);
 if(x&&!confirm(`Conflito com ${x.paciente_nome} (${x.hora.slice(0,5)}, ${x.profissional_nome||''} ${x.cadeira||''}). Agendar mesmo assim?`))return;
 await db.save('consultas',o);await load()}
function editCons(id){const c=S.consultas.find(x=>x.id==id);$('#f').innerHTML=`<div class="card"><h3>${esc(c.paciente_nome)} - ${esc(c.data)} ${esc((c.hora||'').slice(0,5))}</h3><p>${esc(c.procedimento)} | ${esc(c.profissional_nome||'')} ${esc(c.cadeira||'')} | ${c.duracao||30} min</p><div class="row"><select onchange="stCons('${id}',this.value)">${opts(['agendada','confirmada','realizada','cancelada'],s=>`<option ${s==c.status?'selected':''}>${s}</option>`)}</select>${c.paciente_id?`<button class="s" onclick="ficha('${c.paciente_id}')">Abrir ficha</button>`:`<select id="vp">${opts(S.pacientes,p=>`<option value="${p.id}">${esc(p.nome)}</option>`)}</select><button onclick="vinc('${id}')">Vincular paciente</button>`}<button class="d" onclick="delCons('${id}')">Excluir</button></div></div>`;$('#f').scrollIntoView()}
function fProf(){$('#f').innerHTML=`<div class="card"><h3>Profissionais</h3><table>${opts(S.profissionais,p=>`<tr><td><span class="tag" style="background:${p.cor};color:#fff">${esc(p.nome)}</span></td><td>${esc(p.cro)}</td><td><button class="d" onclick="delProf('${p.id}')">x</button></td></tr>`)}</table><div class="row"><input id="pn" placeholder="Nome (Dra. Ana)"><input id="pc" placeholder="CRO"><input id="pk" type="color" value="#0f766e"><button onclick="sProf()">Adicionar</button></div></div>`}

async function delProf(id){if(confirm('Excluir profissional?')){await db.del('profissionais',id);await load()}}

function ficha(id,t){ft=t||ft;fichaBase(id);$('main').insertAdjacentHTML('beforeend',`<div class="row">${opts(FT,([k,l])=>`<button class="${k==ft?'':'s'}" onclick="ficha('${id}','${k}')">${l}</button>`)}</div><div id="fx"></div>`);({anam:tAnam,plano:tPlano,evo:tEvo,fotos:tFotos}[ft])(id)}
const AN=['Diabetes','Hipertensão','Cardiopatia','Gestante','Fumante','Usa anticoagulante','Alergia a anestésico'];
function tAnam(id){const a=S.pacientes.find(x=>x.id==id).anamnese||{};
 $('#fx').innerHTML=`<div class="card"><h3>Anamnese</h3><div class="row">${opts(AN,(k,i)=>`<label style="flex:0 0 auto"><input type="checkbox" id="a${i}" style="width:auto" ${a.cond?.includes(k)?'checked':''}> ${k}</label>`)}</div><div class="row"><input id="aq" placeholder="Queixa principal" value="${esc(a.queixa)}"><input id="aa" placeholder="Alergias" value="${esc(a.alergias)}"></div><div class="row"><input id="am" placeholder="Medicamentos em uso" value="${esc(a.meds)}"><input id="as" placeholder="Cirurgias e tratamentos anteriores" value="${esc(a.cir)}"></div><button onclick="sAnam('${id}')">Salvar anamnese</button></div>`}
async function sAnam(id){const a={cond:AN.filter((k,i)=>$('#a'+i).checked),queixa:$('#aq').value,alergias:$('#aa').value,meds:$('#am').value,cir:$('#as').value};await db.save('pacientes',{id,anamnese:a});S.pacientes.find(x=>x.id==id).anamnese=a;alert('Anamnese salva')}

const totOrc=o=>(o.itens||[]).reduce((a,i)=>a+ +i.valor,0)-(+o.desconto||0);
function tPlano(id){const O=S.orcamentos.filter(o=>o.paciente_id==id);itens=[];
 $('#fx').innerHTML=`<div class="card"><h3>Novo orçamento</h3><div class="row"><input id="od" placeholder="Dente (ex.: 16)" style="max-width:120px"><input id="op" placeholder="Procedimento"><input id="ov" type="number" placeholder="Valor R$"><button class="s" onclick="addIt()">Adicionar item</button></div><table id="oi"></table><div class="row"><input id="odc" type="number" placeholder="Desconto R$"><button onclick="sOrc('${id}')">Salvar orçamento</button></div></div>${opts(O,o=>`<div class="card"><b>${esc((o.created_at||'').slice(0,10))}</b> <span class="tag ${o.status=='aprovado'?'ok':o.status=='recusado'?'no':''}">${o.status}</span><table>${opts(o.itens||[],i=>`<tr><td>${esc(i.dente)}</td><td>${esc(i.proc)}</td><td>${brl(i.valor)}</td></tr>`)}</table><p>Desconto: ${brl(o.desconto)} | <b>Total: ${brl(totOrc(o))}</b></p><div class="row"><button onclick="stOrc('${o.id}','aprovado')">Aprovar</button><button class="s" onclick="stOrc('${o.id}','recusado')">Recusar</button><button class="s" onclick="impOrc('${o.id}')">Imprimir</button><button class="s" onclick="zapOrc('${o.id}')">WhatsApp</button><button class="d" onclick="delOrc('${o.id}')">x</button></div></div>`)}`;rIt()}
function addIt(){const proc=$('#op').value.trim(),v=+$('#ov').value;if(!proc||!v)return alert('Informe procedimento e valor');itens.push({dente:$('#od').value,proc,valor:v});$('#op').value=$('#ov').value=$('#od').value='';rIt()}
function rIt(){$('#oi').innerHTML=opts(itens,(i,k)=>`<tr><td>${esc(i.dente)}</td><td>${esc(i.proc)}</td><td>${brl(i.valor)}</td><td><button class="d" onclick="itens.splice(${k},1);rIt()">x</button></td></tr>`)}
async function sOrc(id){if(!itens.length)return alert('Adicione ao menos um item');const p=S.pacientes.find(x=>x.id==id);await db.save('orcamentos',{paciente_id:id,paciente_nome:p.nome,itens,desconto:+$('#odc').value||0,status:'aberto'});await load();ficha(id,'plano')}
async function stOrc(oid,s){const o=S.orcamentos.find(x=>x.id==oid);await db.save('orcamentos',{id:oid,status:s});await load();ficha(o.paciente_id,'plano')}
async function delOrc(oid){const o=S.orcamentos.find(x=>x.id==oid);if(confirm('Excluir orçamento?')){await db.del('orcamentos',oid);await load();ficha(o.paciente_id,'plano')}}
function zapOrc(oid){const o=S.orcamentos.find(x=>x.id==oid),p=S.pacientes.find(x=>x.id==o.paciente_id);wa(p.telefone,`Olá, ${primeiro(p.nome)}! Segue o orçamento do seu tratamento na ${clin()}:\n`+o.itens.map(i=>`- ${i.dente?'Dente '+i.dente+': ':''}${i.proc}: ${brl(i.valor)}`).join('\n')+`\nTotal: ${brl(totOrc(o))}. Qualquer dúvida, estamos à disposição!`)}
function impOrc(oid){const o=S.orcamentos.find(x=>x.id==oid),w=window.open('','_blank');w.document.write(`<title>Orçamento</title><body style="font:14px system-ui;max-width:700px;margin:30px auto"><h2>${esc(clin())}</h2><h3>Orçamento - ${esc(o.paciente_nome)}</h3><p>${esc((o.created_at||'').slice(0,10))}</p><table border=1 cellpadding=6 style="border-collapse:collapse;width:100%"><tr><th>Dente</th><th>Procedimento</th><th>Valor</th></tr>${opts(o.itens,i=>`<tr><td>${esc(i.dente)}</td><td>${esc(i.proc)}</td><td>${brl(i.valor)}</td></tr>`)}</table><p>Desconto: ${brl(o.desconto)}</p><h3>Total: ${brl(totOrc(o))}</h3><p>Validade: 30 dias.</p><script>print()<\/script>`);w.document.close()}

function tEvo(id){const E=S.evolucoes.filter(e=>e.paciente_id==id);
 $('#fx').innerHTML=`<div class="card"><h3>Evolução clínica</h3><textarea id="et" rows="3" placeholder="Procedimento realizado, observações, orientações..."></textarea><div class="row" style="margin-top:8px"><select id="ep"><option value="">Profissional</option>${opts(S.profissionais,p=>`<option>${esc(p.nome)}</option>`)}</select><button onclick="sEvo('${id}')">Registrar evolução</button></div></div><div class="card">${opts(E,e=>`<p><b>${esc((e.created_at||'').slice(0,10))}</b> ${esc(e.profissional_nome)}<br>${esc(e.texto)}</p>`)||'Sem registros.'}</div>`}
async function sEvo(id){const t=$('#et').value.trim();if(!t)return;await db.save('evolucoes',{paciente_id:id,texto:t,profissional_nome:$('#ep').value});await load();ficha(id,'evo')}

const redim=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.75)};i.src=URL.createObjectURL(f)});
function tFotos(id){const F=S.fotos.filter(f=>f.paciente_id==id);
 $('#fx').innerHTML=`<div class="card"><h3>Fotos</h3><div class="row"><input id="fl" placeholder="Legenda (ex.: antes, 16 oclusal)"><input id="ff" type="file" accept="image/*"><button onclick="sFoto('${id}')">Enviar foto</button></div><div class="gal">${opts(F,f=>`<figure style="margin:0"><img data-p="${esc(f.path)}" alt=""><figcaption>${esc(f.legenda)} <small>${esc((f.created_at||'').slice(0,10))}</small> <a href="#" onclick="delFoto('${f.id}');return false">excluir</a></figcaption></figure>`)||'Sem fotos.'}</div></div>`;
 document.querySelectorAll('#fx img[data-p]').forEach(async im=>{const p=im.dataset.p;if(p.startsWith('data:'))im.src=p;else if(sb){const{data}=await sb.storage.from('fotos-pacientes').createSignedUrl(p,3600);if(data)im.src=data.signedUrl}})}
async function sFoto(id){const f=$('#ff').files[0];if(!f)return alert('Escolha uma imagem');const b=await redim(f);let path;
 if(sb){path=`${id}/${Date.now()}.jpg`;const{error}=await sb.storage.from('fotos-pacientes').upload(path,b,{contentType:'image/jpeg'});if(error)return alert(error.message)}
 else path=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(b)});
 await db.save('fotos',{paciente_id:id,path,legenda:$('#fl').value});await load();ficha(id,'fotos')}
async function delFoto(fid){const f=S.fotos.find(x=>x.id==fid);if(!confirm('Excluir foto?'))return;if(sb&&!f.path.startsWith('data:'))await sb.storage.from('fotos-pacientes').remove([f.path]);await db.del('fotos',fid);await load();ficha(f.paciente_id,'fotos')}
/* ===== GOOGLE AGENDA (envio automatico das consultas) ===== */
let gTok=null,gBusy=false;
try{const s=JSON.parse(sessionStorage.getItem('sp_gt')||'null');if(s&&s.exp>Date.now())gTok=s.t}catch(e){}
function gConectar(){const c=cfg();if(!c.gclient)return alert('Informe o Client ID do Google em Configurações.');const id=c.gclient;if(!/^\d+-[\w-]+\.apps\.googleusercontent\.com$/i.test(id))return alert('O Client ID salvo não parece válido (deve terminar em .apps.googleusercontent.com). Valor atual: '+id);console.log('Client ID enviado ao Google:',id);if(!window.google)return alert('Biblioteca do Google ainda carregando, tente novamente.');
 google.accounts.oauth2.initTokenClient({client_id:c.gclient,scope:'https://www.googleapis.com/auth/calendar.events',callback:r=>{if(r.error)return alert('Google: '+r.error);gTok=r.access_token;sessionStorage.setItem('sp_gt',JSON.stringify({t:gTok,exp:Date.now()+(r.expires_in-60)*1000}));if(view=='agenda')vAgenda();gSync(true)}}).requestAccessToken()}
const gUrl=()=>`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cfg().gcal||'primary')}/events`;
async function gApi(m,id,body){const r=await fetch(gUrl()+(id?'/'+id:''),{method:m,headers:{Authorization:'Bearer '+gTok,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 if(r.status==401){gTok=null;sessionStorage.removeItem('sp_gt');if(view=='agenda')vAgenda();throw new Error('Sessão do Google expirada. Clique em Conectar Google Agenda.')}
 if(r.status==404||r.status==410)return null;if(!r.ok)throw new Error('Google Agenda erro '+r.status);return r.status==204?{}:r.json()}
const gSig=c=>[c.data,c.hora,c.duracao,c.status,c.procedimento,c.profissional_nome,c.cadeira].join('|');
function gEv(c){const[a,b]=(c.hora||'00:00').split(':'),m=a*60+ +b+(c.duracao||30),z=n=>String(n).padStart(2,'0');
 return{summary:`${primeiro(c.paciente_nome)} - ${c.procedimento||'Consulta'}`,description:`${c.profissional_nome||''} ${c.cadeira||''}\nStatus: ${c.status}`.trim(),start:{dateTime:`${c.data}T${z(a)}:${z(b)}:00`,timeZone:'America/Sao_Paulo'},end:{dateTime:`${c.data}T${z(Math.min(23,Math.floor(m/60)))}:${z(m%60)}:00`,timeZone:'America/Sao_Paulo'}}}
async function gSync(manual){if(!gTok||gBusy)return;gBusy=true;let n=0,again=false;
 try{for(const c of S.consultas){const sig=gSig(c);
   if(c.status=='cancelada'){if(c.google_event_id){await gApi('DELETE',c.google_event_id);await db.save('consultas',{id:c.id,google_event_id:null,google_sig:null});c.google_event_id=null;n++}continue}
   if(!c.data||(c.data<hoje()&&!c.google_event_id))continue;
   if(!c.google_event_id){const r=await gApi('POST','',gEv(c));if(r){await db.save('consultas',{id:c.id,google_event_id:r.id,google_sig:sig});c.google_event_id=r.id;c.google_sig=sig;n++}}
   else if(c.google_sig!=sig){let r=await gApi('PATCH',c.google_event_id,gEv(c));if(!r)r=await gApi('POST','',gEv(c));await db.save('consultas',{id:c.id,google_event_id:r.id||c.google_event_id,google_sig:sig});c.google_event_id=r.id||c.google_event_id;c.google_sig=sig;n++}}
  if(cfg().gimp!='nao'){const k=await gPull();n+=k;if(k)again=true}if(manual)alert(n?`${n} consulta(s) sincronizada(s) com o Google Agenda.`:'Google Agenda já está atualizado.')}
 catch(e){alert(e.message)}finally{gBusy=false}if(again)load()}
async function gDel(id){const c=S.consultas.find(x=>x.id==id);if(gTok&&c?.google_event_id){try{await gApi('DELETE',c.google_event_id)}catch(e){}}}
/* ===== GOOGLE AGENDA -> SISTEMA (importacao) ===== */
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function achaPac(n){const k=norm(n);if(!k)return null;let l=S.pacientes.filter(p=>norm(p.nome)==k);if(l.length!=1)l=S.pacientes.filter(p=>norm(p.nome).split(' ')[0]==k);if(l.length!=1)l=S.pacientes.filter(p=>norm(p.nome).startsWith(k));return l.length==1?l[0]:null}
async function gList(){let items=[],pt='';const a=new Date();a.setDate(a.getDate()-1);const b=new Date();b.setDate(b.getDate()+90);
 do{const q=new URLSearchParams({singleEvents:'true',showDeleted:'true',maxResults:'250',timeZone:'America/Sao_Paulo',timeMin:a.toISOString(),timeMax:b.toISOString()});if(pt)q.set('pageToken',pt);
  const r=await fetch(gUrl()+'?'+q,{headers:{Authorization:'Bearer '+gTok}});
  if(r.status==401){gTok=null;sessionStorage.removeItem('sp_gt');if(view=='agenda')vAgenda();throw new Error('Sessão do Google expirada. Clique em Conectar Google Agenda.')}
  if(!r.ok)throw new Error('Google Agenda erro '+r.status);const j=await r.json();items=items.concat(j.items||[]);pt=j.nextPageToken||''}while(pt);return items}
async function gPull(){const ev=await gList(),by={};S.consultas.forEach(c=>{if(c.google_event_id)by[c.google_event_id]=c});let n=0;
 for(const e of ev){const c=by[e.id];
  if(e.status=='cancelled'){if(c&&c.status!='cancelada'){await db.save('consultas',{id:c.id,status:'cancelada'});c.status='cancelada';n++}continue}
  if(!e.start?.dateTime||!e.end?.dateTime)continue;
  const data=e.start.dateTime.slice(0,10),hora=e.start.dateTime.slice(11,16),dur=Math.max(5,Math.round((new Date(e.end.dateTime)-new Date(e.start.dateTime))/6e4));
  if(c){if(c.status=='cancelada')continue;if(c.data!=data||(c.hora||'').slice(0,5)!=hora||(c.duracao||30)!=dur){Object.assign(c,{data,hora,duracao:dur});c.google_sig=gSig(c);await db.save('consultas',{id:c.id,data,hora,duracao:dur,google_sig:c.google_sig});n++}continue}
  const t=String(e.summary||'Sem título'),i=t.indexOf(' - '),nome=(i>0?t.slice(0,i):t).trim(),proc=i>0?t.slice(i+3).trim():'',p=achaPac(nome);
  const o={paciente_id:p?.id||null,paciente_nome:p?.nome||nome,data,hora,duracao:dur,procedimento:proc,valor:0,status:'agendada',pago:false,google_event_id:e.id};o.google_sig=gSig(o);await db.save('consultas',o);n++}
 return n}
async function vinc(id){const p=S.pacientes.find(x=>x.id==$('#vp').value);if(!p)return alert('Cadastre o paciente primeiro');await db.save('consultas',{id,paciente_id:p.id,paciente_nome:p.nome});await load()}
setInterval(()=>{if(gTok&&view=='agenda'&&!$('#f')?.innerHTML)gSync()},180000);
boot();
</script></body></html>

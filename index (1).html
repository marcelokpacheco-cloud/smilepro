<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmilePro Gestão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--p:#0f766e;--bg:#f4f7f7;--c:#fff;--t:#1f2937;--m:#6b7280;--b:#e5e7eb;--r:#dc2626}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
nav{width:200px;background:var(--p);color:#fff;padding:16px 0;flex-shrink:0}
nav h1{font-size:16px;margin:0 16px 16px}nav a{display:block;padding:10px 16px;color:#d1fae5;cursor:pointer}nav a.on,nav a:hover{background:#115e59;color:#fff}
main{flex:1;padding:20px;overflow:auto;min-width:0}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}.kpis .card{margin:0}.kpis b{display:block;font-size:22px;color:var(--p)}.kpis span{color:var(--m)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b)}th{color:var(--m);font-weight:600}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--b);border-radius:6px;font:inherit}
button{background:var(--p);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}button.s{background:#e5e7eb;color:var(--t)}button.d{background:var(--r)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.row>*{flex:1;min-width:140px}.row>button{flex:0 0 auto}
.odo{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}.odo button{padding:6px 0;font-size:11px;background:#fff;color:var(--t);border:1px solid var(--b)}
.st1{background:#fecaca!important}.st2{background:#bfdbfe!important}.st3{background:#d1d5db!important;text-decoration:line-through}.st4{background:#fde68a!important}
.chat{height:340px;overflow:auto;border:1px solid var(--b);border-radius:6px;padding:10px;margin-bottom:8px;background:#fafafa}.chat p{margin:0 0 8px;white-space:pre-wrap}.chat .u{text-align:right;color:var(--p)}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:#e5e7eb}.tag.ok{background:#d1fae5}.tag.no{background:#fee2e2}.kan{display:flex;gap:10px;overflow-x:auto;align-items:flex-start}.col{min-width:220px;flex:1;background:#eef2f2;border-radius:8px;padding:8px}.lead{background:#fff;border:1px solid var(--b);border-radius:6px;padding:8px;margin-top:8px}.lead select{margin-top:6px}
.gr th,.gr td{padding:4px;border:1px solid var(--b);font-size:12px;min-width:92px;vertical-align:top;cursor:pointer}.gr th:first-child{min-width:48px}.ev{color:#fff;border-radius:4px;padding:2px 6px;margin-bottom:2px}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gal img{width:100%;border-radius:6px}
@media(max-width:700px){body{flex-direction:column}nav{width:auto;display:flex;overflow:auto}nav h1{display:none}.odo{grid-template-columns:repeat(8,1fr)}}
</style></head><body><nav></nav><main></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
let RC={};
const cfgLocal=()=>JSON.parse(localStorage.getItem('sp_cfg')||'{}');
const cfg=()=>({...cfgLocal(),...RC});
/* url/key do Supabase ficam no navegador (necessários para conectar); o resto vive na tabela "configuracoes" */
async function loadCfg(){if(!sb)return;
 const{data,error}=await sb.from('configuracoes').select('dados').eq('id','clinica').maybeSingle();
 if(error){console.warn('configuracoes:',error.message);alert('Não foi possível ler as configurações no Supabase ('+error.message+'). Crie a tabela "configuracoes" (veja o SQL).');return}
 const{url,key,...rest}=cfgLocal();let dados=data?.dados||{};
 if(Object.keys(rest).length){dados={...dados,...rest};const{error:e2}=await sb.from('configuracoes').upsert({id:'clinica',dados,updated_at:new Date().toISOString()});
  if(e2){alert('Erro ao gravar configurações no Supabase: '+e2.message);RC=dados;return}
  localStorage.setItem('sp_cfg',JSON.stringify({url,key}))}
 RC=dados}
let sb=null,S={pacientes:[],consultas:[],leads:[],pesquisas:[],log:[],profissionais:[],orcamentos:[],evolucoes:[],fotos:[],posts:[],notas:[]},view='dash',chat=[];
let sbKey='';function initSb(){const c=cfg(),k=c.url+'|'+c.key;if(c.url&&c.key&&window.supabase){if(!sb||k!=sbKey){sb=supabase.createClient(c.url,c.key);sbKey=k}}else sb=null}
const LS=t=>JSON.parse(localStorage.getItem('sp_'+t)||'[]');
const db={
 async list(t){if(sb){const{data,error}=await sb.from(t).select('*').order('created_at',{ascending:false});if(error)throw error;return data}return LS(t)},
 async save(t,o){if(sb){const{error}=o.id?await sb.from(t).update(o).eq('id',o.id):await sb.from(t).insert(o);if(error)throw error;return}
  const l=LS(t);if(o.id){const i=l.findIndex(x=>x.id==o.id);l[i]={...l[i],...o}}else l.unshift({...o,id:crypto.randomUUID(),created_at:new Date().toISOString()});localStorage.setItem('sp_'+t,JSON.stringify(l))},
 async del(t,id){if(sb){await sb.from(t).delete().eq('id',id);return}localStorage.setItem('sp_'+t,JSON.stringify(LS(t).filter(x=>x.id!=id)))}
};
async function gemini(prompt,sys){const k=cfg().gemini;if(!k)throw new Error('Configure a chave Gemini em Configurações.');
 for(let i=0;i<4;i++){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg().modelo||'gemini-3.5-flash'}:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys||''}]},contents:[{role:'user',parts:[{text:prompt}]}]})});
  if(r.ok){const j=await r.json();return j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||''}
  if(![429,500,503].includes(r.status))throw new Error('Gemini '+r.status+(r.status==404?' (modelo indisponível: troque o modelo em Configurações)':''));await new Promise(s=>setTimeout(s,1000*2**i))}
 throw new Error('Gemini indisponível, tente novamente.')}
const ctx=()=>`Você é a assistente da clínica ${cfg().nome||'SmilePro Odontologia'} (Curitiba). Responda em português do Brasil, de forma objetiva e profissional. Nunca dê diagnóstico definitivo; sugira avaliação do dentista. Dados: ${S.pacientes.length} pacientes. Consultas de hoje: ${JSON.stringify(S.consultas.filter(c=>c.data==hoje()).map(c=>({p:c.paciente_nome,h:c.hora,proc:c.procedimento,st:c.status})))}`;

async function boot(){initSb();if(sb){const{data}=await sb.auth.getSession();if(!data.session)return login();await loadCfg()}load()}
function login(){$('nav').innerHTML='';$('main').innerHTML=`<div class="card" style="max-width:340px;margin:60px auto"><h3>Entrar</h3><input id="le" placeholder="E-mail" style="margin-bottom:8px"><input id="lp" type="password" placeholder="Senha" style="margin-bottom:8px"><button onclick="doLogin()">Entrar</button> <button class="s" onclick="go('cfg')">Configurações</button></div>`}
async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:$('#le').value,password:$('#lp').value});if(error)return alert(error.message);boot()}
async function load(){try{[S.pacientes,S.consultas,S.leads,S.pesquisas,S.log,S.profissionais,S.orcamentos,S.evolucoes,S.fotos,S.posts,S.notas]=await Promise.all(['pacientes','consultas','leads','pesquisas','mensagens_log','profissionais','orcamentos','evolucoes','fotos','posts','notas_fiscais'].map(t=>db.list(t).catch(e=>{if(['posts','notas_fiscais'].includes(t))return[];throw e})))}catch(e){alert('Erro Supabase: '+e.message)}render()}
const NAV=[['dash','Painel'],['pac','Pacientes'],['agenda','Agenda'],['fin','Financeiro'],['nf','Notas fiscais'],['crm','CRM'],['mkt','Marketing'],['ia','🤖 Assistente IA'],['cfg','Configurações']];
function render(){$('nav').innerHTML='<h1>'+esc(cfg().nome||'SmilePro')+'</h1>'+NAV.map(([k,l])=>`<a class="${k==view?'on':''}" onclick="go('${k}')">${l}</a>`).join('')+(sb?`<a onclick="sb.auth.signOut().then(boot)">Sair</a>`:'');
 ({dash:vDash,pac:()=>vPac(),agenda:vAgenda,fin:vFin,nf:vNf,ia:vIa,crm:vCrm,mkt:vMkt,cfg:vCfg}[view])()}
const go=v=>{view=v;render()};

function vDash(){const m=hoje().slice(0,7),pg=S.consultas.filter(c=>c.pago),sum=a=>a.reduce((s,c)=>s+ +c.valor,0);
 const mes=sum(pg.filter(c=>(c.data||'').startsWith(m))),rec=sum(S.consultas.filter(c=>!c.pago&&c.status!='cancelada'));
 const n=new Date(),meses=[...Array(6)].map((_,i)=>{const d=new Date(n.getFullYear(),n.getMonth()-5+i,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')});
 const vals=meses.map(k=>sum(pg.filter(c=>(c.data||'').startsWith(k)))),mx=Math.max(...vals,1);
 const bars=vals.map((v,i)=>{const h=v/mx*130;return `<rect x="${20+i*60}" y="${160-h}" width="40" height="${h}" fill="#0f766e" rx="3"/><text x="${40+i*60}" y="178" font-size="11" text-anchor="middle">${meses[i].slice(5)}/${meses[i].slice(2,4)}</text><text x="${40+i*60}" y="${154-h}" font-size="10" text-anchor="middle">${v?Math.round(v):''}</text>`}).join('');
 $('main').innerHTML=`<div class="kpis"><div class="card"><b>${S.pacientes.length}</b><span>Pacientes</span></div><div class="card"><b>${S.consultas.filter(c=>c.data==hoje()).length}</b><span>Consultas hoje</span></div><div class="card"><b>${brl(mes)}</b><span>Recebido no mês</span></div><div class="card"><b>${brl(rec)}</b><span>A receber</span></div></div><div class="card"><h3>Recebimentos (6 meses, R$)</h3><svg viewBox="0 0 380 190" width="100%" style="max-width:520px">${bars}</svg></div>`}

const dig=s=>String(s||'').replace(/\D/g,'');
const fmtCpf=s=>{const d=dig(s);return d.length==11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):(s||'')};
function cpfOk(s){const d=dig(s);if(d.length!=11||/^(\d)\1{10}$/.test(d))return false;for(let t=9;t<11;t++){let n=0;for(let i=0;i<t;i++)n+=d[i]*(t+1-i);n=(n*10)%11%10;if(n!=d[t])return false}return true}
const maskCpf=el=>{el.value=dig(el.value).slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')};
const maskTel=el=>{const d=dig(el.value).slice(0,11);el.value=d.length>10?d.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3'):d.length>6?d.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3'):d.length>2?d.replace(/(\d{2})(\d+)/,'($1) $2'):d};
function vPac(q=''){const k=q.toLowerCase(),kd=dig(q),l=S.pacientes.filter(p=>(p.nome||'').toLowerCase().includes(k)||(p.telefone||'').toLowerCase().includes(k)||(kd&&(dig(p.cpf).includes(kd)||dig(p.telefone).includes(kd))));
 $('main').innerHTML=`${sb?'':'<div class="card" style="border-color:#f59e0b">Modo demonstração: os dados dos pacientes ficam apenas neste navegador. Configure o Supabase em Configurações para armazená-los com segurança.</div>'}<div class="row"><input id="q" placeholder="Buscar por nome, CPF ou contato" value="${esc(q)}" oninput="vPac(this.value);const e=$('#q');e.focus();e.setSelectionRange(99,99)"><button onclick="fPac()">Novo paciente</button><button class="s" onclick="fichaAv()">Ficha em branco</button></div><div id="f"></div><div class="card"><table><tr><th>Nome</th><th>CPF</th><th>Contato</th><th>Nascimento</th><th></th></tr>${l.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(fmtCpf(p.cpf))}</td><td>${esc(p.telefone)}</td><td>${esc(dbr(p.nascimento))}</td><td style="white-space:nowrap"><button class="s" onclick="ficha('${p.id}')">Ficha</button> <button class="s" onclick="fichaAv('${p.id}')">Imprimir</button></td></tr>`).join('')||'<tr><td colspan=5>Nenhum paciente.</td></tr>'}</table></div>`}
function fPac(id){const p=S.pacientes.find(x=>x.id==id)||{},sm='style="color:var(--m);display:block;margin-bottom:2px"';$('#f').innerHTML=`<div class="card"><h3>${id?'Editar':'Novo'} paciente</h3>
 <div class="row"><label style="flex:2 1 260px"><small ${sm}>Nome completo *</small><input id="n" autocomplete="off" value="${esc(p.nome)}"></label><label><small ${sm}>CPF *</small><input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" value="${esc(fmtCpf(p.cpf))}" oninput="maskCpf(this)"></label></div>
 <div class="row"><label><small ${sm}>Contato (WhatsApp com DDD) *</small><input id="t" inputmode="tel" placeholder="(41) 99999-9999" value="${esc(p.telefone)}" oninput="maskTel(this)"></label><label><small ${sm}>Data de nascimento *</small><input id="d" type="date" value="${esc(p.nascimento)}"></label></div>
 <div class="row"><label style="flex:1 1 100%"><small ${sm}>Endereço completo *</small><input id="en" placeholder="Rua, número, complemento, bairro, cidade - UF, CEP" value="${esc(p.endereco)}"></label></div>
 <div class="row"><label style="flex:1 1 100%"><small ${sm}>Pagador (opcional)</small><input id="pg" placeholder="Preencha só se quem paga for outra pessoa (ex.: responsável)" value="${esc(p.pagador)}"></label></div>
 <textarea id="h" rows="3" placeholder="Histórico, alergias, observações">${esc(p.historico)}</textarea><div class="row" style="margin-top:8px"><button onclick="sPac('${id||''}')">Salvar</button><button class="s" onclick="$('#f').innerHTML=''">Cancelar</button></div></div>`;$('#f').scrollIntoView()}
async function sPac(id){const g=i=>$('#'+i).value.trim(),cpf=dig(g('cpf')),o={nome:g('n').replace(/\s+/g,' '),cpf,telefone:g('t'),nascimento:$('#d').value||null,endereco:g('en'),pagador:g('pg')||null,historico:$('#h').value};
 if(o.nome.split(' ').length<2)return alert('Informe o nome completo (nome e sobrenome).');
 if(!cpfOk(cpf))return alert('CPF inválido. Confira os 11 dígitos.');
 const dup=S.pacientes.find(x=>x.id!=id&&dig(x.cpf)==cpf);if(dup)return alert('Já existe um paciente com este CPF: '+dup.nome);
 if(dig(o.telefone).length<10)return alert('Informe o contato com DDD.');
 if(!o.nascimento)return alert('Informe a data de nascimento.');
 if(o.nascimento>hoje()||o.nascimento<'1900-01-01')return alert('Data de nascimento inválida.');
 if(o.endereco.length<8)return alert('Informe o endereço completo.');
 if(id)o.id=id;
 try{await db.save('pacientes',o)}catch(e){const m=String(e.code||'')+' '+String(e.message||'');return alert(/23505|duplicate/i.test(m)?'Já existe um paciente com este CPF.':/column|schema cache/i.test(m)?'O banco ainda não tem as novas colunas. Rode o arquivo pacientes_seguro.sql no Supabase.':'Erro ao salvar: '+(e.message||e))}
 view='pac';await load()}
async function delPac(id){if(confirm('Excluir paciente e suas consultas?')){await db.del('pacientes',id);view='pac';await load()}}

const ST=['Saudável','Cárie','Restaurado','Ausente','Em tratamento'],TT=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28,48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
function fichaBase(id){const p=S.pacientes.find(x=>x.id==id),d=p.dentes||{},cs=S.consultas.filter(c=>c.paciente_id==id);
 $('main').innerHTML=`<div class="row"><button class="s" onclick="go('pac')">Voltar</button><button onclick="fPac('${id}')">Editar dados</button><button onclick="fichaAv('${id}')">🖨 Imprimir ficha de avaliação</button><button class="d" onclick="delPac('${id}')">Excluir</button></div><div class="card"><h3>${esc(p.nome)}</h3><table><tr><td style="width:130px;color:var(--m)">CPF</td><td>${esc(fmtCpf(p.cpf))}</td></tr><tr><td style="color:var(--m)">Contato</td><td>${esc(p.telefone)}</td></tr><tr><td style="color:var(--m)">Nascimento</td><td>${esc(dbr(p.nascimento))}</td></tr><tr><td style="color:var(--m)">Endereço</td><td>${esc(p.endereco)}</td></tr>${p.pagador?`<tr><td style="color:var(--m)">Pagador</td><td>${esc(p.pagador)}</td></tr>`:''}</table><p>${esc(p.historico)}</p></div><div id="f"></div><div class="card"><h3>Odontograma</h3><p style="color:var(--m)">Clique para alternar: saudável, cárie (vermelho), restaurado (azul), ausente (cinza), em tratamento (amarelo).</p><div class="odo">${TT.map(t=>`<button class="st${d[t]||0}" title="${ST[d[t]||0]}" onclick="dente('${id}',${t})">${t}</button>`).join('')}</div></div><div class="card"><h3>Consultas</h3><table>${cs.map(c=>`<tr><td>${esc(c.data)}</td><td>${esc(c.procedimento)}</td><td>${brl(c.valor)}</td><td>${esc(c.status)}</td></tr>`).join('')||'<tr><td>Sem consultas.</td></tr>'}</table></div><div class="card"><button onclick="resumo('${id}')">🤖 Resumo do paciente com IA</button><p id="rs" style="white-space:pre-wrap"></p></div>`}
async function dente(id,t){const p=S.pacientes.find(x=>x.id==id),d={...(p.dentes||{})};d[t]=((d[t]||0)+1)%5;await db.save('pacientes',{id,dentes:d});p.dentes=d;ficha(id)}
async function resumo(id){const p=S.pacientes.find(x=>x.id==id),el=$('#rs');el.textContent='Gerando...';
 try{el.textContent=await gemini('Resuma para o dentista a ficha deste paciente, com pontos de atenção e próximos passos sugeridos (sem diagnóstico definitivo): '+JSON.stringify({nascimento:p.nascimento,anamnese:p.anamnese,historico:p.historico,dentes:Object.entries(p.dentes||{}).map(([t,s])=>t+': '+ST[s]),consultas:S.consultas.filter(c=>c.paciente_id==id).map(c=>[c.data,c.procedimento,c.status])}),ctx())}catch(e){el.textContent=e.message}}

function vAgLista(){const l=[...S.consultas].sort((a,b)=>((a.data||'')+(a.hora||'')).localeCompare((b.data||'')+(b.hora||'')));
 $('main').innerHTML=`<div class="row"><button class="s" onclick="ag.tab='sem';vAgenda()">Ver semana</button></div><div class="card"><h3>Nova consulta</h3><div class="row"><select id="cp">${S.pacientes.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select><input id="cd" type="date" value="${hoje()}"><input id="ch" type="time" value="09:00"><input id="cr" placeholder="Procedimento"><input id="cv" type="number" placeholder="Valor R$"><button onclick="sCons()">Agendar</button></div></div><div class="card"><table><tr><th>Data</th><th>Hora</th><th>Paciente</th><th>Procedimento</th><th>Status</th><th></th></tr>${l.map(c=>`<tr><td>${esc(c.data)}</td><td>${esc((c.hora||'').slice(0,5))}</td><td>${esc(c.paciente_nome)}</td><td>${esc(c.procedimento)}</td><td><select onchange="stCons('${c.id}',this.value)">${['agendada','confirmada','realizada','cancelada'].map(s=>`<option ${s==c.status?'selected':''}>${s}</option>`).join('')}</select></td><td style="white-space:nowrap"><button class="s" onclick="lembrete('${c.id}')">Lembrete</button> <button class="d" onclick="delCons('${c.id}')">x</button></td></tr>`).join('')||'<tr><td colspan=6>Sem consultas.</td></tr>'}</table></div>`}
async function stCons(id,s){await db.save('consultas',{id,status:s});await load()}
async function delCons(id){if(confirm('Excluir consulta?')){await gDel(id);await db.del('consultas',id);await load()}}
async function lembrete(id){const c=S.consultas.find(x=>x.id==id),p=S.pacientes.find(x=>x.id==c.paciente_id);let m;
 try{m=await gemini(`Escreva uma mensagem curta e cordial de WhatsApp lembrando ${c.paciente_nome} da consulta (${c.procedimento||'consulta'}) em ${c.data} às ${(c.hora||'').slice(0,5)}, pedindo confirmação. Sem emojis.`,ctx())}catch(e){return alert(e.message)}
 const tel='55'+String(p?.telefone||'').replace(/\D/g,'').replace(/^55/,'');window.open(`https://wa.me/${tel}?text=${encodeURIComponent(m.trim())}`)}

function vFin(){const l=S.consultas.filter(c=>c.valor>0);
 $('main').innerHTML=`<div class="card"><table><tr><th>Data</th><th>Paciente</th><th>Procedimento</th><th>Valor</th><th>Pagamento</th></tr>${l.map(c=>`<tr><td>${esc(c.data)}</td><td>${esc(c.paciente_nome)}</td><td>${esc(c.procedimento)}</td><td>${brl(c.valor)}</td><td><button class="${c.pago?'':'s'}" onclick="pagar('${c.id}',${!c.pago})">${c.pago?'Pago':'Pendente'}</button></td></tr>`).join('')||'<tr><td>Sem lançamentos.</td></tr>'}</table></div>`}
async function pagar(id,v){await db.save('consultas',{id,pago:v});await load()}

  if(c.data==addDias(1)&&['agendada','confirmada'].includes(c.status))f.push({...b,tipo:'lembrete',det:`Consulta ${c.data} às ${h}`,fb:`Olá, ${pn}! Passando para lembrar da sua consulta amanhã, às ${h}, na ${clin()}. Pode confirmar sua presença?`});

 return f.filter(x=>!L.has(x.tipo+'|'+x.ref))}

let gTok=null,gBusy=false;
try{const s=JSON.parse(sessionStorage.getItem('sp_gt')||'null');if(s&&s.exp>Date.now())gTok=s.t}catch(e){}
function gConectar(){const c=cfg();if(!c.gclient)return alert('Informe o Client ID do Google em Configurações.');const id=c.gclient;if(!/^\d+-[\w-]+\.apps\.googleusercontent\.com$/i.test(id))return alert('O Client ID salvo não parece válido (deve terminar em .apps.googleusercontent.com). Valor atual: '+id);console.log('Client ID enviado ao Google:',id);if(!window.google)return alert('Biblioteca do Google ainda carregando, tente novamente.');
 google.accounts.oauth2.initTokenClient({client_id:c.gclient,scope:'https://www.googleapis.com/auth/calendar.events',callback:r=>{if(r.error)return alert('Google: '+r.error);gTok=r.access_token;sessionStorage.setItem('sp_gt',JSON.stringify({t:gTok,exp:Date.now()+(r.expires_in-60)*1000}));if(view=='agenda')vAgenda();gSync()}}).requestAccessToken()}
const gUrl=()=>`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cfg().gcal||'primary')}/events`;
async function gApi(m,id,body){const r=await fetch(gUrl()+(id?'/'+id:''),{method:m,headers:{Authorization:'Bearer '+gTok,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 if(r.status==401){gTok=null;sessionStorage.removeItem('sp_gt');if(view=='agenda')vAgenda();throw new Error('Sessão do Google expirada. Clique em Conectar Google Agenda.')}
 if(r.status==404||r.status==410)return null;if(!r.ok)throw new Error('Google Agenda erro '+r.status);return r.status==204?{}:r.json()}
const gSig=c=>[c.data,c.hora,c.duracao,c.status,c.procedimento,c.profissional_nome,c.cadeira].join('|');
function gEv(c){const[a,b]=(c.hora||'00:00').split(':'),m=a*60+ +b+(c.duracao||30),z=n=>String(n).padStart(2,'0');
 return{summary:`${primeiro(c.paciente_nome)} - ${c.procedimento||'Consulta'}`,description:`${c.profissional_nome||''} ${c.cadeira||''}\nStatus: ${c.status}`.trim(),start:{dateTime:`${c.data}T${z(a)}:${z(b)}:00`,timeZone:'America/Sao_Paulo'},end:{dateTime:`${c.data}T${z(Math.min(23,Math.floor(m/60)))}:${z(m%60)}:00`,timeZone:'America/Sao_Paulo'}}}
let gP=[];
const gH=c=>(c.hora||'').slice(0,5),gLbl=c=>`${c.paciente_nome} ${dbr(c.data)} ${gH(c)}`;
const GT={new:'→ Google',upd:'→ Google',del:'→ Google',pnew:'← Sistema',pupd:'← Sistema',pcanc:'← Sistema'};

async function gPlan(){const P=[];
 for(const c of S.consultas){
  if(c.status=='cancelada'){if(c.google_event_id)P.push({t:'del',c,txt:'Excluir do Google: '+gLbl(c)});continue}
  if(!c.data||(c.data<hoje()&&!c.google_event_id))continue;
  if(!c.google_event_id)P.push({t:'new',c,txt:'Criar no Google: '+gLbl(c)});
  else if(c.google_sig!=gSig(c))P.push({t:'upd',c,txt:'Atualizar no Google: '+gLbl(c)})}
 if(cfg().gimp!='nao'){const ev=await gList(),by={};S.consultas.forEach(c=>{if(c.google_event_id)by[c.google_event_id]=c});
  for(const e of ev){const c=by[e.id];
   if(e.status=='cancelled'){if(c&&c.status!='cancelada')P.push({t:'pcanc',c,txt:'Cancelar no sistema (removida no Google): '+gLbl(c)});continue}
   if(!e.start?.dateTime||!e.end?.dateTime)continue;
   const data=e.start.dateTime.slice(0,10),hora=e.start.dateTime.slice(11,16),dur=Math.max(5,Math.round((new Date(e.end.dateTime)-new Date(e.start.dateTime))/6e4));
   if(c){if(c.status=='cancelada'||c.google_sig!=gSig(c))continue;if(c.data!=data||gH(c)!=hora||(c.duracao||30)!=dur)P.push({t:'pupd',c,data,hora,dur,txt:`Atualizar no sistema (alterada no Google): ${c.paciente_nome} ${dbr(c.data)} ${gH(c)} → ${dbr(data)} ${hora}`});continue}
   const tt=String(e.summary||'Sem título'),i=tt.indexOf(' - '),nome=(i>0?tt.slice(0,i):tt).trim(),proc=i>0?tt.slice(i+3).trim():'',p=achaPac(nome);
   P.push({t:'pnew',e,data,hora,dur,nome:p?.nome||nome,pid:p?.id||null,proc,txt:`Importar para o sistema: ${p?.nome||nome} ${dbr(data)} ${hora}`})}}
 return P}
async function gSync(){if(!gTok)return gConectar();if(gBusy)return;gBusy=true;
 try{gP=await gPlan();if(!gP.length)return alert('Google Agenda e sistema já estão alinhados. Nada a alterar.');gRev()}
 catch(e){alert(e.message)}finally{gBusy=false}}
function gRev(){if(view!='agenda'){view='agenda';render()}
 $('#f').innerHTML=`<div class="card"><h3>Alterações pendentes com o Google Agenda</h3><p style="color:var(--m)">Nada é enviado ao Google nem alterado no sistema sem a sua autorização. Marque apenas o que deseja aplicar.</p><table>${opts(gP,(x,i)=>`<tr><td style="width:30px"><input type="checkbox" class="gk" id="gk${i}" style="width:auto"></td><td><span class="tag ${x.t=='del'?'no':''}">${GT[x.t]}</span></td><td><label for="gk${i}">${esc(x.txt)}</label></td></tr>`)}</table><div class="row" style="margin-top:8px"><button class="s" onclick="document.querySelectorAll('.gk').forEach(k=>k.checked=true)">Marcar todas</button><button onclick="gApply()">Aplicar selecionadas</button><button class="s" onclick="$('#f').innerHTML=''">Fechar sem alterar</button></div></div>`;$('#f').scrollIntoView()}
async function gApply(){const sel=gP.filter((x,i)=>$('#gk'+i)?.checked);if(!sel.length)return alert('Nenhuma alteração selecionada.');
 if(!confirm(`Aplicar ${sel.length} alteração(ões) selecionada(s)?`))return;gBusy=true;let n=0;
 try{for(const x of sel){const c=x.c;
   if(x.t=='new'){const r=await gApi('POST','',gEv(c));if(r){await db.save('consultas',{id:c.id,google_event_id:r.id,google_sig:gSig(c)});n++}}
   else if(x.t=='upd'){let r=await gApi('PATCH',c.google_event_id,gEv(c));if(!r)r=await gApi('POST','',gEv(c));await db.save('consultas',{id:c.id,google_event_id:r.id||c.google_event_id,google_sig:gSig(c)});n++}
   else if(x.t=='del'){await gApi('DELETE',c.google_event_id);await db.save('consultas',{id:c.id,google_event_id:null,google_sig:null});n++}
   else if(x.t=='pcanc'){await db.save('consultas',{id:c.id,status:'cancelada'});n++}
   else if(x.t=='pupd'){const o={...c,data:x.data,hora:x.hora,duracao:x.dur};await db.save('consultas',{id:c.id,data:x.data,hora:x.hora,duracao:x.dur,google_sig:gSig(o)});n++}
   else if(x.t=='pnew'){const o={paciente_id:x.pid,paciente_nome:x.nome,data:x.data,hora:x.hora,duracao:x.dur,procedimento:x.proc,valor:0,status:'agendada',pago:false,google_event_id:x.e.id};o.google_sig=gSig(o);await db.save('consultas',o);n++}}
  alert(n+' alteração(ões) aplicada(s).')}
 catch(e){alert(e.message)}finally{gBusy=false}await load()}
async function gDel(id){const c=S.consultas.find(x=>x.id==id);if(gTok&&c?.google_event_id&&confirm('Esta consulta está no Google Agenda. Excluir também o evento de lá?')){try{await gApi('DELETE',c.google_event_id)}catch(e){alert(e.message)}}}

const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function achaPac(n){const k=norm(n);if(!k)return null;let l=S.pacientes.filter(p=>norm(p.nome)==k);if(l.length!=1)l=S.pacientes.filter(p=>norm(p.nome).split(' ')[0]==k);if(l.length!=1)l=S.pacientes.filter(p=>norm(p.nome).startsWith(k));return l.length==1?l[0]:null}
async function gList(){let items=[],pt='';const a=new Date();a.setDate(a.getDate()-1);const b=new Date();b.setDate(b.getDate()+90);
 do{const q=new URLSearchParams({singleEvents:'true',showDeleted:'true',maxResults:'250',timeZone:'America/Sao_Paulo',timeMin:a.toISOString(),timeMax:b.toISOString()});if(pt)q.set('pageToken',pt);
  const r=await fetch(gUrl()+'?'+q,{headers:{Authorization:'Bearer '+gTok}});
  if(r.status==401){gTok=null;sessionStorage.removeItem('sp_gt');if(view=='agenda')vAgenda();throw new Error('Sessão do Google expirada. Clique em Conectar Google Agenda.')}
  if(!r.ok)throw new Error('Google Agenda erro '+r.status);const j=await r.json();items=items.concat(j.items||[]);pt=j.nextPageToken||''}while(pt);return items}

 const dados=`<div class="st">DADOS DO PACIENTE</div><div class="bx"><div class="g">${f('Nome completo',p?.nome,6)}${f('CPF',fmtCpf(p?.cpf),3)}${f('Data de nascimento',p?.nascimento?dbr(p.nascimento)+(idadeDe(p.nascimento)?' ('+idadeDe(p.nascimento)+')':''):'',3)}${f('Contato (WhatsApp)',p?.telefone,3)}${f('E-mail','',4)}${f('Estado civil','',2)}${f('Profissão','',3)}${f('Endereço',p?.endereco,12)}${f('Pagador (se outra pessoa)',p?.pagador,4)}${f('Convênio','',4)}${f('Indicado por','',4)}</div></div>`;
 const anam=`<div class="st">ANAMNESE</div><div class="bx"><div class="g">${f('Queixa principal',A.queixa,12).replace('class="v"','class="v m"')}</div><div class="cks">${opts(FA_COND,([k,l])=>cb(k&&cond.includes(k),l))}</div><div class="g">${f('Alergias (quais?)',A.alergias,4)}${f('Medicamentos em uso',A.meds,4)}${f('Cirurgias / tratamentos anteriores',A.cir,4)}${f('Observações de saúde',p?.historico,12).replace('class="v"','class="v m" style="max-height:18.8mm"')}</div></div>`;
 const odo=`<div class="st">ODONTOGRAMA E EXAME CLÍNICO</div><div class="bx" style="padding-top:2mm">${odontoSvg(p?.dentes||{})}<div class="lg2"><span><i style="background:#fecaca;border-color:#dc2626"></i>Cárie</span><span><i style="background:#bfdbfe;border-color:#2563eb"></i>Restaurado</span><span><i style="background:#e5e7eb;border-color:#475569"></i>Ausente (X)</span><span><i style="background:#fde68a;border-color:#d97706"></i>Em tratamento</span><span>Faces: V, L, M, D e O (centro)</span></div><div class="g">${f('Exame clínico / observações','',12)}</div></div>`;
 const todos=orc?.itens||[],itens=todos.slice(0,todos.length>5?4:5),mais=todos.length>5?todos.length-4:0,blank=Math.max(0,5-itens.length-(mais?1:0));
 const plano=`<div class="st">PLANO DE TRATAMENTO</div><div class="bx" style="padding:1.5mm 2.5mm 2mm"><table class="pl"><tr><th style="width:15mm">Dente</th><th>Procedimento</th><th style="width:26mm">Valor</th><th style="width:15mm">Feito</th></tr>${opts(itens,i=>`<tr><td>${E(i.dente)}</td><td>${E(i.proc)}</td><td>${brl(i.valor)}</td><td></td></tr>`)}${mais?`<tr><td></td><td><i>+ ${mais} itens (ver orçamento no sistema)</i></td><td></td><td></td></tr>`:''}${'<tr><td></td><td></td><td></td><td></td></tr>'.repeat(blank)}</table><div style="display:flex;justify-content:space-between;margin-top:1.5mm;font-size:8pt"><span>Forma de pagamento: ______________________________</span><span><b>Total: ${orc?brl(totOrc(orc)):'R$ ________'}</b></span><span>Data: ___/___/______</span></div></div>`;
 const ass=`<div style="margin-top:2.4mm;font-size:7pt;color:#475569">Declaro que as informações acima são verdadeiras e autorizo o tratamento dos meus dados pessoais e de saúde para fins de atendimento odontológico, conforme a LGPD.</div><div class="sg"><div>Assinatura do paciente ou responsável</div><div>Cirurgião-dentista (CRO)</div></div>`;
 const rod=(n,t)=>`<div class="ft"><span>Documento confidencial: contém dados pessoais e de saúde (LGPD)</span><span>${E(clin())} · Folha ${n}/${t}</span></div>`;
 /* paginas de evolucao */
 const CAP=24,pages=[];let cur=[],used=0;
 evo.forEach(e=>{const tx=String(e.texto||''),u=Math.min(4,Math.max(1,Math.ceil(tx.length/58))),t=tx.length>u*58?tx.slice(0,u*58-1)+'…':tx;if(used+u>CAP){pages.push(cur);cur=[];used=0}cur.push({d:dbr((e.created_at||'').slice(0,10)),t,u,pr:e.profissional_nome||''});used+=u});
 const fill=CAP-used;for(let i=0;i<fill;i++)cur.push({d:'',t:'',u:1,pr:''});pages.push(cur);
 const total=1+pages.length;
 const p1=`<div class="pg">${head('FICHA DE AVALIAÇÃO ODONTOLÓGICA',`Prontuário Nº ${pront||'________'} · Data ${p?dbr(hj):'___/___/______'}`)}${dados}${anam}${odo}${plano}${ass}${rod(1,total)}</div>`;
 const px=pages.map((rows,i)=>`<div class="pg">${head('EVOLUÇÃO DO TRATAMENTO',E(p?.nome||'Paciente: ______________________________')+(pront?' · Prontuário '+pront:''))}<div style="height:3mm"></div><table class="ev"><tr><th style="width:20mm;height:7mm">Data</th><th>Tratamento realizado</th><th style="width:18mm">Dente(s)</th><th style="width:28mm">Próxima sessão</th><th style="width:22mm">Rubrica</th></tr>${opts(rows,r=>`<tr style="height:${r.u*9}mm"><td>${E(r.d)}</td><td>${E(r.t)}</td><td></td><td></td><td style="font-size:6.6pt;color:#64748b">${E(r.pr)}</td></tr>`)}</table>${rod(i+2,total)}</div>`).join('');
 return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Ficha de avaliação${p?' - '+E(p.nome):''}</title><style>${css}</style></head><body>${p1}${px}<script>onload=()=>setTimeout(()=>print(),400)<\/script></body></html>`}
function fichaAv(id){const w=window.open('','_blank');if(!w)return alert('Permita pop-ups neste site para imprimir a ficha.');const p=id?S.pacientes.find(x=>x.id==id):null;w.document.write(htmlFicha(p));w.document.close()}
/* ===== NOTAS FISCAIS (emissao assistida - NFS-e Nacional, Simples Nacional) ===== */
let nfCp=[];
const dbr=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
const nfDesc=c=>(cfg().nfdesc||'Serviços odontológicos')+(c.procedimento?' - '+c.procedimento:'');
function cpv(i,b){navigator.clipboard.writeText(nfCp[i]).then(()=>{b.textContent='Copiado'})}
function vNf(){const R=new Set(S.notas.filter(n=>n.status!='cancelada').map(n=>n.consulta_id)),c=cfg(),
 pend=S.consultas.filter(x=>x.pago&&x.valor>0&&x.status!='cancelada'&&!R.has(x.id)).sort((a,b)=>(b.data||'').localeCompare(a.data||'')),E=S.notas.filter(n=>n.status=='emitida');
 $('main').innerHTML=`${c.cnpj&&c.nfcod?'':'<div class="card" style="border-color:#f59e0b">Preencha o CNPJ e o código de tributação em Configurações para facilitar a emissão. Confirme o código com seu contador (odontologia é o item 4.12 da lista de serviços).</div>'}<div class="kpis"><div class="card"><b>${pend.length}</b><span>Pagamentos sem nota</span></div><div class="card"><b>${brl(pend.reduce((a,x)=>a+ +x.valor,0))}</b><span>Valor sem nota</span></div><div class="card"><b>${E.length}</b><span>Notas emitidas</span></div></div><div id="nfp"></div>
 <div class="card"><h3>Pagamentos sem nota fiscal</h3><p style="color:var(--m)">Emissão assistida: o sistema separa os dados prontos para copiar, você emite no Emissor Nacional (gov.br/nfse) e registra o número aqui. Aparecem os atendimentos marcados como pagos no Financeiro.</p><table><tr><th>Data</th><th>Paciente</th><th>Procedimento</th><th>Valor</th><th></th></tr>${opts(pend,x=>`<tr><td>${esc(dbr(x.data))}</td><td>${esc(x.paciente_nome)}</td><td>${esc(x.procedimento)}</td><td>${brl(x.valor)}</td><td style="white-space:nowrap"><button onclick="nfPrep('${x.id}')">Emitir</button> <button class="s" onclick="nfDisp('${x.id}')">Dispensar</button></td></tr>`)||'<tr><td colspan=5>Nenhum pagamento pendente de nota.</td></tr>'}</table></div>
 <div class="card"><h3>Notas registradas</h3><table><tr><th>Competência</th><th>Paciente</th><th>Número</th><th>Valor</th><th>Status</th><th></th></tr>${opts(S.notas.filter(n=>n.status!='dispensada'),n=>`<tr><td>${esc(dbr(n.competencia))}</td><td>${esc(n.paciente_nome)}</td><td>${esc(n.numero)}</td><td>${brl(n.valor)}</td><td><span class="tag ${n.status=='emitida'?'ok':'no'}">${esc(n.status)}</span></td><td style="white-space:nowrap">${n.status=='emitida'?`${n.link?`<a href="${esc(n.link)}" target="_blank" rel="noopener">Abrir</a> <button class="s" onclick="nfZap('${n.id}')">WhatsApp</button> `:''}<button class="d" onclick="nfCanc('${n.id}')">Cancelar</button>`:''}</td></tr>`)||'<tr><td colspan=6>Nenhuma nota registrada.</td></tr>'}</table></div>`}
function nfPrep(cid){const x=S.consultas.find(k=>k.id==cid),p=S.pacientes.find(k=>k.id==x.paciente_id),c=cfg();
 const F=[['Tomador (paciente)',x.paciente_nome],['CPF do tomador',p?.cpf||''],['Descrição do serviço',nfDesc(x)],['Valor do serviço',(+x.valor).toFixed(2).replace('.',',')],['Data de competência',dbr(x.data)],['Código de tributação nacional',c.nfcod||''],['CNPJ do prestador',c.cnpj||'']].concat(p?.pagador?[['Pagador cadastrado (emita em nome dele, se for o caso)',p.pagador]]:[]);nfCp=F.map(f=>f[1]);
 $('#nfp').innerHTML=`<div class="card"><h3>Emitir nota: ${esc(x.paciente_nome)}</h3>${p?.cpf?'':'<p style="color:var(--r)">Paciente sem CPF cadastrado. Informe na ficha do paciente ou emita sem tomador identificado, se permitido.</p>'}<table>${opts(F,(f,i)=>`<tr><td>${f[0]}</td><td>${esc(f[1])||'<i>não informado</i>'}</td><td><button class="s" onclick="cpv(${i},this)">Copiar</button></td></tr>`)}</table><div class="row" style="margin-top:12px"><button class="s" onclick="window.open('https://www.gov.br/nfse','_blank')">Abrir Emissor Nacional</button></div><div class="row"><input id="nfn" placeholder="Número da nota emitida"><input id="nfl" placeholder="Link ou chave de acesso (opcional)"><button onclick="nfReg('${cid}')">Registrar nota emitida</button></div></div>`;$('#nfp').scrollIntoView()}
async function nfReg(cid){const x=S.consultas.find(k=>k.id==cid),num=$('#nfn').value.trim();if(!num)return alert('Informe o número da nota');
 await db.save('notas_fiscais',{consulta_id:cid,paciente_id:x.paciente_id||null,paciente_nome:x.paciente_nome,descricao:nfDesc(x),valor:x.valor,competencia:x.data,numero:num,link:$('#nfl').value.trim(),status:'emitida'});await load()}
async function nfDisp(cid){const x=S.consultas.find(k=>k.id==cid);if(!confirm('Dispensar a nota deste pagamento (ex.: paciente não solicitou)?'))return;
 await db.save('notas_fiscais',{consulta_id:cid,paciente_id:x.paciente_id||null,paciente_nome:x.paciente_nome,valor:x.valor,competencia:x.data,status:'dispensada'});await load()}
async function nfCanc(id){if(!confirm('Cancelar o registro desta nota? O cancelamento oficial deve ser feito também no Emissor Nacional.'))return;await db.save('notas_fiscais',{id,status:'cancelada'});await load()}
function nfZap(id){const n=S.notas.find(k=>k.id==id),p=S.pacientes.find(k=>k.id==n.paciente_id);if(!p?.telefone)return alert('Paciente sem telefone cadastrado');
 wa(p.telefone,`Olá, ${primeiro(p.nome)}! Segue a nota fiscal nº ${n.numero} do seu atendimento na ${clin()}: ${n.link}`)}
/* sem sincronizacao automatica: toda alteracao no Google Agenda exige autorizacao */
boot();
